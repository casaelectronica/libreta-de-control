<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIBRETA DE CONTROL - CASA ELECTRONICA</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        neoncyan: '#06b6d4',
                        neongreen: '#10b981',
                        neonpink: '#f43f5e',
                    }
                }
            }
        }
    </script>
    <style>
        input, textarea, select {
            text-transform: uppercase;
        }
        input::placeholder, textarea::placeholder {
            text-transform: none;
        }
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
        }
        .print-only {
            display: none;
        }
    </style>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased">

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxv0RoACBfE06wdD_S_IRqMgsey7G9c_ot70ZNS_XSbJmkoWYixs75M1_TJUjjmzLg6/exec";
    </script>

    <!-- HEADER -->
    <header id="main-header" class="bg-cardbg border-b border-slate-800 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500/10 p-2.5 rounded-xl border border-neoncyan/30 text-neoncyan font-black text-xl tracking-wider">
                    ⚡
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider text-white">CASA ELECTRONICA</h1>
                    <p class="text-xs text-slate-400">LIBRETA DE CONTROL DE ALIADOS</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="abrirModalAliado()" class="bg-neoncyan hover:bg-cyan-400 text-darkbg font-bold px-4 py-2.5 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.3)] transition-all flex items-center gap-2 text-xs uppercase">
                    <span>➕</span> NUEVO ALIADO
                </button>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="main-container" class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6 flex flex-col sm:flex-row items-center gap-4">
            <div class="flex items-center gap-3 bg-cardbg p-3 rounded-2xl border border-slate-800 shadow-md w-full">
                <span class="text-slate-400 pl-2">🔍</span>
                <input type="text" id="buscador" oninput="renderizarAliados()" placeholder="BUSCAR ALIADO..." class="w-full bg-transparent text-white focus:outline-none text-sm font-semibold uppercase">
            </div>
            <div id="sync-status" class="text-xs font-bold text-emerald-400 px-4 py-2 bg-cardbg rounded-xl border border-slate-800 whitespace-nowrap">
                🟢 CONECTADO A SHEET
            </div>
        </div>

        <!-- LISTA DE ALIADOS -->
        <div id="lista-aliados" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
            <!-- Se inyecta dinámicamente -->
        </div>
    </main>

    <!-- VISTA DE REPORTE -->
    <div id="vista-reporte" class="print-only max-w-3xl mx-auto p-8 bg-white text-slate-900 min-h-screen">
        <div class="flex justify-between items-center border-b-2 border-slate-300 pb-6 mb-6">
            <div>
                <h2 class="text-2xl font-black text-slate-900 tracking-wide">CASA ELECTRONICA</h2>
                <p class="text-xs font-bold text-slate-600 uppercase mt-0.5">REPORTE DE COBRO - SERVICIOS TÉCNICOS</p>
            </div>
            <div class="text-right">
                <p class="text-xs font-bold text-slate-500 uppercase">FECHA DE REPORTE:</p>
                <p id="rep-fecha" class="font-bold text-slate-800 text-sm">--</p>
            </div>
        </div>

        <div class="mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <p class="text-xs font-bold text-slate-500 uppercase">ALIADO COMERCIAL:</p>
            <p id="rep-nombre-aliado" class="text-lg font-black text-slate-900 uppercase">--</p>
        </div>

        <table class="w-full text-left border-collapse mb-6">
            <thead>
                <tr class="border-b-2 border-slate-300 text-xs font-bold text-slate-700 uppercase">
                    <th class="py-2 px-3">FECHA</th>
                    <th class="py-2 px-3">DESCRIPCIÓN DEL EQUIPO / SERVICIO</th>
                    <th class="py-2 px-3 text-right">VALOR</th>
                </tr>
            </thead>
            <tbody id="rep-tabla-servicios" class="text-sm divide-y divide-slate-200"></tbody>
        </table>

        <div class="flex justify-end border-t-2 border-slate-300 pt-4 mb-10">
            <div class="text-right">
                <p class="text-xs font-bold text-slate-500 uppercase">VALOR TOTAL A PAGAR:</p>
                <p id="rep-total" class="text-2xl font-black text-slate-900 mt-1">$ 0</p>
            </div>
        </div>

        <div class="flex justify-between items-center no-print mt-8 pt-6 border-t border-slate-200">
            <button onclick="cerrarReporte()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold px-6 py-2.5 rounded-xl text-sm transition-all">
                ⬅️ VOLVER A LA APP
            </button>
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm shadow-lg transition-all">
                🖨️ IMPRIMIR / GUARDAR PDF
            </button>
        </div>
    </div>

    <!-- MODAL ALIADO -->
    <div id="modal-aliado" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-cardbg border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl">
            <h3 id="modal-aliado-titulo" class="text-lg font-black text-white mb-4 uppercase">NUEVO ALIADO</h3>
            <form id="form-aliado" onsubmit="guardarAliado(event)">
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">NOMBRE DEL ALIADO</label>
                    <input type="text" id="aliado-nombre" required class="w-full bg-darkbg border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-neoncyan font-semibold uppercase">
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="cerrarModalAliado()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs uppercase transition-all">CANCELAR</button>
                    <button type="submit" class="bg-neoncyan hover:bg-cyan-400 text-darkbg font-bold px-5 py-2 rounded-xl text-xs uppercase transition-all">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL SERVICIO -->
    <div id="modal-servicio" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-cardbg border border-slate-800 rounded-3xl w-full max-w-md p-6 shadow-2xl">
            <h3 id="modal-servicio-titulo" class="text-lg font-black text-white mb-4 uppercase">AGREGAR SERVICIO</h3>
            <form id="form-servicio" onsubmit="guardarServicio(event)">
                <input type="hidden" id="serv-aliado-index">
                
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">FECHA</label>
                    <input type="date" id="serv-fecha" required class="w-full bg-darkbg border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-neoncyan font-semibold">
                </div>
                
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">DESCRIPCIÓN (EQUIPO / TRABAJO)</label>
                    <textarea id="serv-desc" rows="3" required placeholder="EJ: REPARACIÓN DE TARJETA Y CAMBIO DE PANTALLA" class="w-full bg-darkbg border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-neoncyan font-semibold uppercase"></textarea>
                </div>

                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 mb-1 uppercase">VALOR ($)</label>
                    <input type="number" id="serv-valor" required placeholder="0" class="w-full bg-darkbg border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-neoncyan font-semibold">
                </div>

                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="cerrarModalServicio()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs uppercase transition-all">CANCELAR</button>
                    <button type="submit" class="bg-neongreen hover:bg-emerald-400 text-darkbg font-bold px-5 py-2 rounded-xl text-xs uppercase transition-all">GUARDAR SERVICIO</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE CONTROL Y CARGA DESDE LA SHEET -->
    <script>
        let aliados = [];

        document.addEventListener('input', (e) => {
            if ((e.target.tagName === 'INPUT' && e.target.type === 'text') || e.target.tagName === 'TEXTAREA') {
                e.target.value = e.target.value.toUpperCase();
            }
        });

        function formatearMoneda(valor) {
            return '$ ' + Number(valor).toLocaleString('es-CO');
        }

        function obtenerFechaLocal() {
            const now = new Date();
            return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        }

        function mostrarEstado(mensaje, color = 'emerald') {
            const status = document.getElementById('sync-status');
            status.className = `text-xs font-bold text-${color}-400 px-4 py-2 bg-cardbg rounded-xl border border-slate-800 whitespace-nowrap`;
            status.innerText = mensaje;
            setTimeout(() => {
                status.className = "text-xs font-bold text-emerald-400 px-4 py-2 bg-cardbg rounded-xl border border-slate-800 whitespace-nowrap";
                status.innerText = "🟢 CONECTADO A SHEET";
            }, 3000);
        }

        function cargarDatosDesdeSheet() {
            mostrarEstado('⏳ CARGANDO DESDE SHEET...', 'cyan');
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    aliados = [];
                    // 1. Cargar estrictamente los aliados puros desde la pestaña ALIADOS (Columna: NOMBRE)
                    if (data.aliados) {
                        data.aliados.forEach(nombreAliado => {
                            if (!aliados.some(a => a.nombre === nombreAliado)) {
                                aliados.push({ nombre: nombreAliado, servicios: [] });
                            }
                        });
                    }
                    // 2. Asociar los servicios a su respectivo aliado
                    if (data.servicios) {
                        data.servicios.forEach(serv => {
                            let aliadoObj = aliados.find(a => a.nombre === serv.aliado);
                            if (!aliadoObj) {
                                aliadoObj = { nombre: serv.aliado, servicios: [] };
                                aliados.push(aliadoObj);
                            }
                            aliadoObj.servicios.push({
                                fecha: serv.fecha,
                                descripcion: serv.descripcion,
                                valor: serv.valor
                            });
                        });
                    }
                    renderizarAliados();
                    mostrarEstado('🟢 SINCRONIZADO DESDE SHEET');
                })
                .catch(err => {
                    console.error("Error cargando:", err);
                    mostrarEstado('⚠️ ERROR DE CARGA', 'rose');
                });
        }

        function enviarASheet(datos) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            }).catch(err => console.error("Error enviando:", err));
        }

        function renderizarAliados() {
            const contenedor = document.getElementById('lista-aliados');
            const filtro = document.getElementById('buscador').value.toUpperCase();
            contenedor.innerHTML = '';

            const aliadosFiltrados = aliados.filter(a => a.nombre.includes(filtro));

            if (aliadosFiltrados.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-cardbg rounded-3xl border border-slate-800 text-slate-400">
                        <p class="text-sm font-bold">NO HAY ALIADOS REGISTRADOS O COINCIDENTES</p>
                    </div>
                `;
                return;
            }

            aliadosFiltrados.forEach((aliado, originalIndex) => {
                let totalAliado = 0;
                aliado.servicios.forEach(s => totalAliado += Number(s.valor));

                let htmlServicios = '';
                if (aliado.servicios.length === 0) {
                    htmlServicios = `<p class="text-xs text-slate-500 italic py-1">SIN SERVICIOS PENDIENTES</p>`;
                } else {
                    htmlServicios = `<div class="space-y-2 mt-2 max-h-60 overflow-y-auto pr-1">`;
                    aliado.servicios.forEach((serv, sIndex) => {
                        htmlServicios += `
                            <div class="bg-darkbg/60 p-3 rounded-xl border border-slate-800/80 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                                <div>
                                    <div class="flex items-center gap-2">
                                        <span class="text-xs font-bold text-cyan-400 bg-cyan-950/40 px-2 py-0.5 rounded border border-cyan-800/40">${serv.fecha}</span>
                                    </div>
                                    <p class="text-xs font-bold text-white mt-1 uppercase">${serv.descripcion}</p>
                                    <p class="text-xs font-black text-emerald-400 mt-0.5">${formatearMoneda(serv.valor)}</p>
                                </div>
                                <div class="flex items-center gap-1 self-end sm:self-center">
                                    <button onclick="eliminarServicio(${originalIndex}, ${sIndex})" class="p-1.5 bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 rounded-lg text-xs border border-rose-900/30" title="ELIMINAR">🗑️</button>
                                </div>
                            </div>
                        `;
                    });
                    htmlServicios += `</div>`;
                }

                contenedor.innerHTML += `
                    <div class="bg-cardbg border border-slate-800 rounded-3xl p-5 shadow-xl flex flex-col justify-between self-start">
                        <div>
                            <div class="flex justify-between items-start gap-2 mb-3">
                                <div>
                                    <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">ALIADO COMERCIAL</span>
                                    <h2 class="text-lg font-black text-white uppercase">${aliado.nombre}</h2>
                                </div>
                                <div class="flex items-center gap-1">
                                    <button onclick="eliminarAliado(${originalIndex})" class="p-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-400 rounded-xl text-xs border border-rose-900/30" title="ELIMINAR ALIADO">🗑️</button>
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="flex justify-between items-center text-xs font-bold text-slate-400 uppercase mb-1">
                                    <span>SERVICIOS Y EQUIPOS</span>
                                    <span>TOTAL: <strong class="text-emerald-400">${formatearMoneda(totalAliado)}</strong></span>
                                </div>
                                ${htmlServicios}
                            </div>
                        </div>

                        <div class="pt-4 border-t border-slate-800 flex flex-wrap gap-2 justify-between items-center mt-2">
                            <div class="flex items-center gap-2">
                                <button onclick="abrirModalServicio(${originalIndex})" class="bg-neongreen/10 hover:bg-neongreen/20 text-neongreen border border-neongreen/30 font-bold px-3 py-2 rounded-xl text-xs uppercase transition-all flex items-center gap-1">
                                    <span>➕</span> AGREGAR
                                </button>
                                ${aliado.servicios.length > 0 ? `
                                <button onclick="limpiarServiciosAliado(${originalIndex})" class="bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 font-bold px-3 py-2 rounded-xl text-xs uppercase transition-all flex items-center gap-1" title="LIMPIAR / MARCAR COMO PAGADOS">
                                    <span>🧹</span> LIMPIAR PAGO
                                </button>` : ''}
                            </div>
                            <button onclick="generarReporte(${originalIndex})" class="bg-cyan-500/10 hover:bg-cyan-500/20 text-neoncyan border border-neoncyan/30 font-bold px-3 py-2 rounded-xl text-xs uppercase transition-all flex items-center gap-1">
                                <span>🖨️</span> REPORTE
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function abrirModalAliado() {
            document.getElementById('aliado-nombre').value = '';
            document.getElementById('modal-aliado').classList.remove('hidden');
            document.getElementById('modal-aliado').classList.add('flex');
        }

        function cerrarModalAliado() {
            document.getElementById('modal-aliado').classList.remove('flex');
            document.getElementById('modal-aliado').classList.add('hidden');
        }

        function guardarAliado(event) {
            event.preventDefault();
            const nombre = document.getElementById('aliado-nombre').value.toUpperCase();

            if (aliados.some(a => a.nombre === nombre)) {
                alert("ESTE ALIADO YA EXISTE");
                return;
            }

            aliados.push({ nombre: nombre, servicios: [] });
            enviarASheet({ ACCION: 'CREAR_ALIADO', ALIADO: nombre });
            
            cerrarModalAliado();
            renderizarAliados();
            mostrarEstado('✅ ALIADO CREADO EN SHEET');
        }

        function eliminarAliado(index) {
            const aliado = aliados[index];
            if (confirm(`¿ESTÁS SEGURO DE ELIMINAR A "${aliado.nombre}" Y TODOS SUS SERVICIOS?`)) {
                aliados.splice(index, 1);
                renderizarAliados();

                enviarASheet({ ACCION: 'ELIMINAR_ALIADO', ALIADO: aliado.nombre });
                mostrarEstado('🗑️ ALIADO ELIMINADO', 'rose');
            }
        }

        function abrirModalServicio(aliadoIndex) {
            document.getElementById('serv-aliado-index').value = aliadoIndex;
            document.getElementById('serv-fecha').value = obtenerFechaLocal();
            document.getElementById('serv-desc').value = '';
            document.getElementById('serv-valor').value = '';
            document.getElementById('modal-servicio').classList.remove('hidden');
            document.getElementById('modal-servicio').classList.add('flex');
        }

        function cerrarModalServicio() {
            document.getElementById('modal-servicio').classList.remove('flex');
            document.getElementById('modal-servicio').classList.add('hidden');
        }

        function guardarServicio(event) {
            event.preventDefault();
            const aIndex = document.getElementById('serv-aliado-index').value;
            const fecha = document.getElementById('serv-fecha').value;
            const descripcion = document.getElementById('serv-desc').value.toUpperCase();
            const valor = document.getElementById('serv-valor').value;
            const aliadoNombre = aliados[aIndex].nombre;

            aliados[aIndex].servicios.push({ fecha, descripcion, valor });
            
            enviarASheet({
                ACCION: 'CREAR_SERVICIO',
                FECHA: fecha,
                ALIADO: aliadoNombre,
                DESCRIPCION: descripcion,
                VALOR: valor,
                ESTADO: 'PENDIENTE'
            });

            cerrarModalServicio();
            renderizarAliados();
            mostrarEstado('✅ SERVICIO ENVIADO A SHEET');
        }

        function eliminarServicio(aliadoIndex, servicioIndex) {
            if (confirm('¿ESTÁS SEGURO DE ELIMINAR ESTE SERVICIO?')) {
                const aliadoNombre = aliados[aliadoIndex].nombre;
                const servicio = aliados[aliadoIndex].servicios[servicioIndex];
                
                aliados[aliadoIndex].servicios.splice(servicioIndex, 1);
                renderizarAliados();

                enviarASheet({
                    ACCION: 'ELIMINAR_SERVICIO',
                    ALIADO: aliadoNombre,
                    DESCRIPCION: servicio.descripcion,
                    VALOR: servicio.valor
                });
                mostrarEstado('🗑️ SERVICIO ELIMINADO', 'rose');
            }
        }

        function limpiarServiciosAliado(aliadoIndex) {
            const aliado = aliados[aliadoIndex];
            if (confirm(`¿EL ALIADO "${aliado.nombre}" YA PAGÓ? ESTO LIMPIARÁ SUS SERVICIOS.`)) {
                enviarASheet({ ACCION: 'LIMPIAR_ALIADO', ALIADO: aliado.nombre });

                aliado.servicios = [];
                renderizarAliados();
                mostrarEstado('🧹 PAGOS LIMPIADOS');
            }
        }

        function generarReporte(aliadoIndex) {
            const aliado = aliados[aliadoIndex];
            document.getElementById('rep-nombre-aliado').innerText = aliado.nombre;
            document.getElementById('rep-fecha').innerText = new Date().toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' }).toUpperCase();

            const tbody = document.getElementById('rep-tabla-servicios');
            tbody.innerHTML = '';
            let total = 0;

            if (aliado.servicios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500 italic">SIN SERVICIOS PENDIENTES</td></tr>`;
            } else {
                aliado.servicios.forEach(s => {
                    total += Number(s.valor);
                    tbody.innerHTML += `
                        <tr class="border-b border-slate-100">
                            <td class="py-3 px-3 font-semibold text-slate-600">${s.fecha}</td>
                            <td class="py-3 px-3 font-bold text-slate-900 uppercase">${s.descripcion}</td>
                            <td class="py-3 px-3 text-right font-black text-slate-900">${formatearMoneda(s.valor)}</td>
                        </tr>
                    `;
                });
            }
            document.getElementById('rep-total').innerText = formatearMoneda(total);

            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('main-container').classList.add('hidden');
            document.getElementById('vista-reporte').classList.remove('print-only');
            document.getElementById('vista-reporte').classList.remove('hidden');
        }

        function cerrarReporte() {
            document.getElementById('vista-reporte').classList.add('hidden');
            document.getElementById('vista-reporte').classList.add('print-only');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('main-container').classList.remove('hidden');
        }

        // CARGAR DATOS AUTOMÁTICAMENTE AL ABRIR LA PÁGINA
        cargarDatosDesdeSheet();
    </script>
</body>
</html>
